<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#133d7a">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>A51 원격 실행</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;display:grid;place-items:center;padding:20px;background:#edf2fa;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#10243f}
    main{width:min(100%,400px);background:white;border:1px solid #dae3f3;border-radius:22px;box-shadow:0 18px 40px #17356615;padding:30px 25px;text-align:center;position:relative}
    h1{font-size:24px;letter-spacing:-.8px;margin:16px 0 9px}
    p{color:#63738a;font-size:14px;line-height:1.6;margin:0 0 28px}
    .gear{position:absolute;right:15px;top:15px;background:transparent;border:0;cursor:pointer;font-size:24px;color:#7a8799;padding:7px}
    .launch{display:block;width:100%;border:0;border-radius:18px;padding:35px 10px;font-size:27px;font-weight:750;background:#1d56cf;color:white;box-shadow:0 9px 18px #1d56cf2b;cursor:pointer}
    .launch:disabled{opacity:.6;cursor:wait}
    .status{font-size:13px;color:#53657f;min-height:42px;margin-top:20px;line-height:1.6}
    .foot{font-size:11px;color:#8290a4;line-height:1.6}
    dialog{border:0;border-radius:18px;box-shadow:0 15px 55px #0005;width:min(95vw,390px);padding:22px}
    dialog::backdrop{background:#172e4a99}
    dialog h2{font-size:19px;margin:0 0 10px}
    dialog p{text-align:left;margin:0 0 14px}
    label{font-weight:600;display:block;font-size:13px;margin-bottom:6px}
    input{width:100%;padding:12px;border:1px solid #c9d4e7;border-radius:11px;font-size:14px}
    .actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}
    .actions button{border:0;padding:11px 16px;border-radius:9px;font-weight:700;cursor:pointer}
    .cancel{background:#eaf0f7;color:#345}
    .save{background:#1d56cf;color:white}
    #error{color:#b91c1c;font-size:12px;min-height:1.2em;margin-top:7px}
  </style>
</head>
<body>
  <main>
    <button class="gear" id="gear" title="트리거 주소 설정" aria-label="트리거 주소 설정">⚙</button>
    <h1>A51 원격 실행</h1>
    <p>갤럭시 A51의 MacroDroid 매크로를<br>버튼 한 번으로 실행합니다.</p>
    <button class="launch" id="launch">▶ 실행</button>
    <div class="status" id="status" role="status" aria-live="polite"></div>
    <div class="foot">실행 요청은 카카오톡 메시지 발송 성공 확인과 다릅니다.</div>
  </main>
  <dialog id="settings">
    <h2>최초 1회 설정</h2>
    <p>MacroDroid에서 복사한 트리거 URL을 넣으세요. 이 주소는 GitHub에 저장되지 않고 현재 브라우저에만 저장됩니다.</p>
    <label for="url">MacroDroid 트리거 URL</label>
    <input id="url" type="url" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="https://trigger.macrodroid.com/...">
    <div id="error" role="alert"></div>
    <div class="actions">
      <button class="cancel" id="cancel">취소</button>
      <button class="save" id="save">저장</button>
    </div>
  </dialog>
  <script>
    (() => {
      'use strict';
      const KEY = 'a51_trigger_url_local_v1';
      const el = id => document.getElementById(id);
      const status = el('status');
      const dlg = el('settings');
      const input = el('url');
      const launch = el('launch');
      const getURL = () => { try { return localStorage.getItem(KEY) || ''; } catch { return ''; } };
      const valid = v => {
        try {
          const u = new URL(v.trim());
          return u.protocol === 'https:' && u.hostname === 'trigger.macrodroid.com'
            && u.pathname.split('/').filter(Boolean).length >= 2 && !u.username && !u.password;
        } catch { return false; }
      };
      const update = () => { status.textContent = valid(getURL()) ? '준비 완료 · 버튼을 눌러 실행하세요.' : '오른쪽 위 ⚙에서 트리거 주소를 1회 등록하세요.'; };
      function showSettings() { input.value = getURL(); el('error').textContent = ''; dlg.showModal(); }
      el('gear').addEventListener('click', showSettings);
      el('cancel').addEventListener('click', () => dlg.close());
      el('save').addEventListener('click', () => {
        const v = input.value.trim();
        if (!valid(v)) { el('error').textContent = 'MacroDroid 트리거 URL을 정확히 입력하세요.'; return; }
        try { localStorage.setItem(KEY, v); } catch { el('error').textContent = '현재 브라우저에 저장할 수 없습니다.'; return; }
        dlg.close(); update();
      });
      launch.addEventListener('click', async () => {
        const url = getURL();
        if (!valid(url)) { showSettings(); return; }
        launch.disabled = true;
        status.textContent = 'A51에 실행 요청을 보내고 있습니다...';
        try {
          await fetch(url, {method:'GET', mode:'no-cors', cache:'no-store', referrerPolicy:'no-referrer', credentials:'omit'});
          status.textContent = '실행 요청을 보냈습니다. 실제 실행 여부는 A51에서 확인하세요.';
        } catch {
          status.textContent = '요청 결과를 확인할 수 없습니다. A51을 확인하거나 다시 시도하세요.';
        }
        setTimeout(() => { launch.disabled = false; }, 3000);
      });
      update();
    })();
  </script>
</body>
</html>
